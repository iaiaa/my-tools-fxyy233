(function(){
  var PWD = '8520';
  var ls = document.getElementById('lockScreen');
  var pi = document.getElementById('pwdInput');
  var pb = document.getElementById('pwdBtn');
  var le = document.getElementById('lockErr');
  var app = document.getElementById('appMain');
  if (sessionStorage.getItem('fc_unlocked') === '1') { ls.classList.add('unlocked'); app.classList.add('visible'); }
  function tryUnlock() {
    if (pi.value === PWD) {
      sessionStorage.setItem('fc_unlocked', '1');
      ls.classList.add('unlocked');
      app.classList.add('visible');
    } else {
      le.textContent = '密码不对';
      pi.value = '';
      pi.focus();
    }
  }
  pb.addEventListener('click', tryUnlock);
  pi.addEventListener('keydown', function(e) { if (e.key === 'Enter') tryUnlock(); });
  pi.focus();
})();

ncing biodiversity variation amongcities worldwide have recently been analysed, a global analysis on the factorsinfluencing biodiversity levels within cities is still lacking.","zh":"缺少某种证据* alack of understanding of these effects has been a primary obstacle toimplementing such strategies.; 缺少相关证据成为形成某种策略的主要障碍"},{"id":902,"cat":7,"catName":"八、生态专业术语","en":"However,while separate factors influencing biodiversity variation among cities worldwidehave recently been analysed, a global analysis on the factors influencing biodiversitylevels within cities is still lacking.","zh":"缺少"},{"id":903,"cat":7,"catName":"八、生态专业术语","en":"Using thismethod, studies of phenological responsiveness to climate change in previously unstudiedareas may provide crucial information needed for conservation efforts.","zh":""},{"id":904,"cat":7,"catName":"八、生态专业术语","en":"substitutexxx = supplant xxx","zh":"代替xxx"},{"id":905,"cat":7,"catName":"八、生态专业术语","en":"dispersed = scattered = individual","zh":"分散的"},{"id":906,"cat":7,"catName":"八、生态专业术语","en":"In summary,our results corroborate the validity of species-area relationships alsoin urban landscapes.","zh":""},{"id":907,"cat":7,"catName":"八、生态专业术语","en":"Regressionanalysis is used to explore the relationship between LST and the urban characteristicsdiscussed in Section 3 over each grid structure, and to determine the estimationmethod that best represents the UHI.","zh":"回归分析"},{"id":908,"cat":7,"catName":"八、生态专业术语","en":"The studyregion encloses a large portion (~20,500 km^2) of north-central Victoria, Australia:from the River Murray in the north to the slopes of the Great Dividing Range inthe south and east (Fig.1). The region has a Mediterranean climate, with hot, drysummers (average daily maximum in January is ~30'C) and most rainfall in winterand spring. Although the climate is relatively uniform across the region, rainfallincreases from the north-west to the southeast (range: 400–670 mm per annum). Thetwo major landforms in the region are the inland slopes of the Great Dividing Rangeand the riverine plain of the Murray Basin.","zh":""},{"id":909,"cat":7,"catName":"八、生态专业术语","en":"Guam isin 13'26'N. latitude and 144'39'E. longitude.","zh":""},{"id":910,"cat":7,"catName":"八、生态专业术语","en":"The campis situated just north of the 69th parallel, inside the Arctic circle.* Accordingto UN-HABITAT (2008), the city was among the fastest growing cities in Africa withan average annual growth rate of 4.1% between 1990 and 2006. The city is locatedat altitudes ranging from 2025 to 3028 m. The mean annual temperature rangeis 16–18 ◦C. Addis Ababa receives an average rainfall of 1255mm per year. A review of climate records for over one hundred years by Conway,Mould, and Bewket (2004) shows an increase of minimum and maximum air temperaturesin Addis Ababa of 0.4 ◦C/decade and 0.2 ◦C/decade, respectively.","zh":""},{"id":911,"cat":7,"catName":"八、生态专业术语","en":"RoyalNational Park, spanning a total area of 15068 ha, is located in eastern Australia,on the southern fringe of metropolitan Sydney. Established in 1879, it includesthe first area of land to be set aside as a National Park in Australia (NPWS 2000).It is Australia’s oldest, and the second oldest National Park after Yellowstonein the USA. Annual mean precipitation for the area ranges between 1143 and 1270mm. The Park consists of a Hawkesbury Sandstone plateau up to 200m in elevation.The plateau is characterized by steep valleys and ridges, rocky outcrops and streamspunctuated by waterfalls and pools (Fairley 1995). Over 2 million people visitthe Park annually, a rate of use that is exceptionally high given the Park’s size.Introduced species are becoming increasingly common in the Park, with non-nativeplant species now comprising 20% of the local flora and an estimated 6000 ha ofthe Park affected by invasive plants (NPWS 2000).","zh":""},{"id":912,"cat":7,"catName":"八、生态专业术语","en":"mountainterrain","zh":"山地地形"},{"id":913,"cat":7,"catName":"八、生态专业术语","en":"hill-shapedte d is resilient to stress","zh":""},{"id":927,"cat":7,"catName":"八、生态专业术语","en":"We canquantify the exotic ratio as a function of area with fitted power law species–arearelationships","zh":"用幂函数拟合入侵指数和面积之间的关系"},{"id":928,"cat":7,"catName":"八、生态专业术语","en":"TheEAR curve is consistent with the concept of ‘imminent extinction’,which states that predictions of near-term extinctions due to habitat lossshould focus on species endemic to the area of destroyed habitat","zh":""},{"id":929,"cat":7,"catName":"八、生态专业术语","en":"wherethe subscripts E and N denote exotic and native, respectively, S is species richness,and c and z are fitted parameters. As the parameter z is the slope of the species-arearelationship plotted on natural","zh":"log（自然对数）-transformed axes, the null modelpredicts that exotic and native species-area relationships will be parallel lines."},{"id":930,"cat":7,"catName":"八、生态专业术语","en":"Species-arearelationships are excellent for this test because they are influenced by environmentalconditions and species traits","zh":""},{"id":931,"cat":7,"catName":"八、生态专业术语","en":"A species–arearelationship that has been empirically demonstrated in many systems (MacArthurand Wilson 1963, Diamond 1975, Rosenzweig 1995) takes the form xxx, or, equivalently,","zh":""},{"id":932,"cat":7,"catName":"八、生态专业术语","en":"whereS(A) is the number of species in a censused patch of area A, S0 is the number ofspecies found in an entire biome of area A0, and z is a constant typicallyin the range of 0.10–0.35.","zh":""},{"id":933,"cat":7,"catName":"八、生态专业术语","en":"In log–logspace, the value of z gives the slope of the increasing number of specieswith increasing area.","zh":""},{"id":934,"cat":7,"catName":"八、生态专业术语","en":"The slopeof the relationship between residence time and abundance was significantly greaterat the continental scale compared with the regional scale.","zh":""},{"id":935,"cat":7,"catName":"八、生态专业术语","en":"and zis the slope of the SA curve, which is assumed to average a typical value suchas 0.25 for the relationship between habitat area and species richness (Pimm &Askins, 1995","zh":"Brooks et al., 1997, 2002)"},{"id":936,"cat":7,"catName":"八、生态专业术语","en":"The slopeof each line quantifies the phenological responsiveness for each species.","zh":""},{"id":937,"cat":7,"catName":"八、生态专业术语","en":"alongurban–rural gradients","zh":""},{"id":938,"cat":7,"catName":"八、生态专业术语","en":"Althoughgradients or categories may explain some variation in biodiversity levels (Dunn&Heneghan 2011), a transformation of the urban landscape into these gradients orcategories, e.g. of urbanization or socioeconomic parameters, masks the underlyingdriving factors of the biophysical urban landscape.","zh":""},{"id":939,"cat":7,"catName":"八、生态专业术语","en":"Differentspecies disappear at different points on the habitat loss gradient (Lande 1993,Gibbs 1998, Hager 1998, Eriksson and Kiviniemi 1999)","zh":""},{"id":940,"cat":7,"catName":"八、生态专业术语","en":"Consequently,simple random maps offer little opportunity for systematically examining populationresponses along a gradient of habitat patchiness that is more typical of thatobserved in natural systems.","zh":""},{"id":941,"cat":7,"catName":"八、生态专业术语","en":"at thelandscape level","zh":""},{"id":942,"cat":7,"catName":"八、生态专业术语","en":"Changesin ecosystem structure and function along a chronosequence of restored grasslands.","zh":"时间序列"},{"id":943,"cat":7,"catName":"八、生态专业术语","en":"Urbanmicroclimate models vary widely with regard to their physical basis and spatial/temporalresolution. Ali-Toudert & Mayer (2006) provide a detailed critiqueofcontemporary models at the micro-scale with fine temporal resolutions.","zh":"时空序列"},{"id":944,"cat":7,"catName":"八、生态专业术语","en":"To reduceinterdependence, we only included studies with a temporal gradient if they useddifferent plots (when the response variables were determined on a plot basis)or different individuals (when the response variables were determined on a plantindividual basis) in different years","zh":"时间序列"},{"id":945,"cat":7,"catName":"八、生态专业术语","en":"The repeatedmeasurement of temperature and humidity at a fixed set of locations during 15 consecutivedays can be characterized as pseudo-replication with two temporal dimensions.The first dimension is the variation in temperature within days and the secondis the variation between days._ [good].","zh":"时间尺度，时间轴"},{"id":946,"cat":7,"catName":"八、生态专业术语","en":"Overlarger spatial and temporal scales, species with quite different trait complexesmay prove to be just as vulnerable to fragmentation.","zh":"空间与时间序列"},{"id":947,"cat":7,"catName":"八、生态专业术语","en":"scalingrules or systematic scaling methods are scarce especially when heterogeneous landscapesare considered.","zh":"在异质性的景观中，排序的法则或系统的排序方法目前还很少"},{"id":948,"cat":7,"catName":"八、生态专业术语","en":"theaccelerated pace of population growth","zh":"快速增长的种群数量"},{"id":949,"cat":7,"catName":"八、生态专业术语","en":"rapid/severedeclines/loss/reduction in species richness","zh":"快速减少"},{"id":950,"cat":7,"catName":"八、生态专业术语","en":"areelevated relative to","zh":"非常相关"},{"id":951,"cat":7,"catName":"八、生态专业术语","en":"Becausesome matrix habitats inhibit dispersal more than others.","zh":""},{"id":952,"cat":7,"catName":"八、生态专业术语","en":"However,as the number of species increases at the point scale there is an inhibitoryeffect on the slope z.","zh":"抑制效果"},{"id":953,"cat":7,"catName":"八、生态专业术语","en":"andthe “extinction threshold” is the minimum amount of habitat requiredfor a population of a particular species to persist in a landscape","zh":"拐点的描述"},{"id":954,"cat":7,"catName":"八、生态专业术语","en":"Thresholdvalues for species richness computed for areas of study sites ranged from 1 to140 ha, with an average threshold area of 26.7 ha.","zh":""},{"id":955,"cat":7,"catName":"八、生态专业术语","en":"Vegetationcover below 10% has been found to cause rapid declines in species richness(Radford et al. 2005), and some authors (e.g. Andr en 1994) suggest that alandscape-level threshold of 20–30% of a specific habitat has to remain toprevent the combined effects of habitat loss and fragmentation to exacerbatethe loss of species or populations (Hedblom & Soderstrom 2010).","zh":"拐点的综述* However,population response deviated from a pure amount effect as coverage wasreduced below 30%–50%. That deviation coincided with a persistencethresholdas indicated by a rapid decline in the probability oflandscapes supporting viable populations.; 数据描述"},{"id":956,"cat":7,"catName":"八、生态专业术语","en":"analysedspatial thresholds that authors identified to prevent species loss","zh":"拐点作用"},{"id":957,"cat":7,"catName":"八、生态专业术语","en":"Inthe former case, the threshold is depicted as the minimum amount ofhabitat below which the equilibrium population size is 0 (Fig. 1A), and inthe latter case it is depicted as the minimum amount of habitat below which theprobability of long term population survival is ,1 (Fig. 1B).","zh":"被描述为"},{"id":958,"cat":7,"catName":"八、生态专业术语","en":"Thisresult holds regardless of how well the power-law SAR fits species–areadata","zh":""},{"id":959,"cat":7,"catName":"八、生态专业术语","en":"Thechi-square test for goodness of fit was used to compare observed andexpected dominance–diversity distributions (Pielou, 1975) and curves wereconsidered good fits at P = 0.05.","zh":""},{"id":960,"cat":7,"catName":"八、生态专业术语","en":"alternativearrangement","zh":"第二选项，其他可能性"},{"id":961,"cat":7,"catName":"八、生态专业术语","en":"xx haveimportant consequence for species persistence in fragmented landscape","zh":"有重要影响"},{"id":962,"cat":7,"catName":"八、生态专业术语","en":"trait = property = attribute","zh":"特性"},{"id":963,"cat":7,"catName":"八、生态专业术语","en":"These thresholdvalues have not been identified specifically for urban landscapes","zh":"这些阈值不适用于城市景观"},{"id":964,"cat":7,"catName":"八、生态专业术语","en":"showedthat bird and plant species densities vary substantially among cities andwere explained best by a city’s urban land cover","zh":""},{"id":965,"cat":7,"catName":"八、生态专业术语","en":"Plantheight could not explain unique variation in invasion success at eitherspatial scale.","zh":""},{"id":966,"cat":7,"catName":"八、生态专业术语","en":"Restorationcan influence which trajectory of change occurs in the transition fromdegraded to desired state","zh":"e.g. applying topsoils to mined areas can ensurerecovery to a particular community type by supplying propagules and soilresources"},{"id":967,"cat":7,"catName":"八、生态专业术语","en":"Weshow that confounding factors can mask many fragmentation effects. Forinstance, there are multiple ways in which species traits like trophic level","zh":"（营养级）, dispersal ability（扩散能力）and degree of habitatspecialisation（特殊生境需求） influence species level responses."},{"id":968,"cat":7,"catName":"八、生态专业术语","en":"Moreover,many fragmentation effects like changes in genetic, morphological orbehavioural traits of species require time to appear. By contrast,synergisticinteractions of fragmentation with climate change,human-altered disturbance regimes, species interactions and other driversof population decline may magnify the impacts of fragmentation. Toconclude, we emphasise that anthropogenic fragmentation is a recentphenomenon in evolutionary time and suggest that the final, long-term impactsof habitat fragmentation may not yet have shown themselves.","zh":""},{"id":969,"cat":7,"catName":"八、生态专业术语","en":"Theyare being increasingly used to predict when a system might suddenlycollapse as a result of gradual changes in climatic factors, humanexploitation of biotic resources, habitat loss and fragmentation (Box 2,[18–21]).","zh":"急剧减少"},{"id":970,"cat":7,"catName":"八、生态专业术语","en":"Nonetheless,if urban planning focuses on preserving also large areas of habitats(\u003e 50 ha) and a network of corridors between them, cities may evendevelop into refuges for species conservation.","zh":""},{"id":971,"cat":7,"catName":"八、生态专业术语","en":"theheterogeneous distribution of elevated surface temperatures","zh":""},{"id":972,"cat":7,"catName":"八、生态专业术语","en":"Environmentalheterogeneity as a universal driver of species richness across taxa, biomes andspatial scales.","zh":""},{"id":973,"cat":7,"catName":"八、生态专业术语","en":"Matrixis the “background ecological system” of a landscape with a high degree ofconnectivity. Connectivity is the measure of how connected or spatiallycontinuous a corridor, network, or matrix is.[5] For example, a forestedlandscape (matrix) with fewer gaps in forest cover (open patches) will havehigher connectivity. Corridors have important functions as strips of aparticular type of landscape differing from adjacent land on both sides.[5] Anetwork is an interconnected system of corridors while mosaic describes thepattern of patches, corridors, and matrix that form a landscape in itsentirety.[5]","zh":""},{"id":974,"cat":7,"catName":"八、生态专业术语","en":"Populationecology often distinguishes local habitat features from those of thesurrounding landscape (‘matrix’) (Ricketts 2001).","zh":""},{"id":975,"cat":7,"catName":"八、生态专业术语","en":"Thestructure and function of a landscape is largely affected by the spatialarrangement of these heterogeneous patches (Byomkesh et al. 2012), andmainly dominated by key GI elements, which have a high correlation to landscapefunction and structure and occupy a certain area of the landscape","zh":""},{"id":976,"cat":7,"catName":"八、生态专业术语","en":"Recentlythere has been a growing trend toward development of detailed models ofspecies in landscapes, that can incorporate effects of landscape spatialpattern on population dynamics (Dunninget al., 1995","zh":"Holt et al., 1995).; 最近的研究"},{"id":977,"cat":7,"catName":"八、生态专业术语","en":"The_implication of this model is that_ populations of different species in acommunity reach a stable equilibrium without the _development of dominance_by any one species (Whittaker, 1972).* BritishIsles in total is approximately 1100 species. The extraordinarily highplant biodiversity of exotic and native plants in domestic gardens istroubling to conventional biodiversity thought in which exotic speciesare excluded on the arbitrary assumption that they do not positivelycontribute to ecosystem well-being (Sagoff, 2005).","zh":""},{"id":978,"cat":7,"catName":"八、生态专业术语","en":"Themagnitude of a species’ phenological response to temperature may haveeither positive or negative impacts on growth and reproduction dependingon various interacting environmental factors.","zh":""},{"id":979,"cat":7,"catName":"八、生态专业术语","en":"naturalpopulation development of","zh":""},{"id":980,"cat":7,"catName":"八、生态专业术语","en":"* Figure2 | The influence of scale and geometry on the EAR and the SAR. a, c, Thegraphs compare the outward EAR and the inward EAR with the backward SAR model(λSAR) and the forward EAR model (λEAR) fitted to the data of each plot.Points correspond to the value of the EAR for each area size, sampled as inFig. 1. The z value for λEAR comes from He and Hubbell1, whereas the z valuefor the λSAR comes from the fit of the power law to the linear region of theSAR. b, d, Fit of the powerlaw SAR (SSAR) to the data on a log–logscale. Each point corresponds to the average number of species for randomlyplaced rectangles with a given area size. The SAR sampled from the centre tothe periphery (Fig. 1a) gives similar z values (zBCI = 0.1265 and zYasuni = 0.0625). All z values were obtained by nonlinear least squares. Thedashed vertical line marks the minimum area included in the fit. The topplots are for the tree and shrub species in the 50 ha plot in Barro ColoradoIsland (BCI), Panama, whereas the bottom plots are for the 50 ha plot inYasuni, Ecuador.","zh":""},{"id":981,"cat":7,"catName":"八、生态专业术语","en":"whenhabitat loss reaches a point at which habitat continuity is broken","zh":""},{"id":982,"cat":7,"catName":"八、生态专业术语","en":"Asystematic random sampling technique was used within each of the selected greenareas to determine the points (plots) where microclimate measurements should becarried out","zh":""},{"id":983,"cat":7,"catName":"八、生态专业术语","en":"Inshort, the y-intercept of the species–area curve appears to be influenced bydominance–diversity patterns and is best interpreted as demonstrating that asthe dominance of a selected few species increases in a community, the pointdiversity decreases. This is reflected in the strong relationship betweenlog c and the proportion of the flora comprising annuals, suggesting that it is possible to cram more annual species into 1 m2 than perennials. However,as the number of species increases at the point scale there is aninhibitory effect on the slope z.","zh":""},{"id":984,"cat":7,"catName":"八、生态专业术语","en":"whereasextinction thresholds for individual species represent the point at which theextinction process commences (probability of survival \u003c1)","zh":""},{"id":985,"cat":7,"catName":"八、生态专业术语","en":"However,if grazing pressure increased beyond E2 the system would ‘collapse’ to adegraded system dominated by shrubs (S2) because a threshold point has beenexceeded.","zh":""},{"id":986,"cat":7,"catName":"八、生态专业术语","en":"quantifyingseparately the effects of individual urban features on biodiversity levels","zh":""},{"id":987,"cat":7,"catName":"八、生态专业术语","en":"drawson contributions from both metapopulation ecology and landscape ecology","zh":"对xxx有贡献"},{"id":988,"cat":7,"catName":"八、生态专业术语","en":"-Using this method, studies of phenological responsiveness to climate change inpreviously unstudied areas may provide crucial information needed forconservation efforts.","zh":"在未知的领域研究，提供新的证据"},{"id":989,"cat":7,"catName":"八、生态专业术语","en":"Fieldand laboratory assistance was provided by Natalie Ball, Tara Chandler, Sharne Plummerand Kevin Smith. We are particularly grateful to Louisa Murray and Bob Coveny ofthe Royal Botanic Gardens (Sydney) for assistance with accessing distribution recordsand with identifying plant specimens respectively. This work was carried out underNational Parks and Wildlife Service permits S10578 and S11224.","zh":""}];

var state = {
  cat: 'all',
  mode: 'seq',
  dir: 'zh2en',
  queue: [],
  idx: 0,
  flipped: false,
  known: new Set(),
  again: new Set()
};

function loadProgress() {
  try {
    var raw = localStorage.getItem('flashcard_progress_v2');
    if (!raw) return;
    var p = JSON.parse(raw);
    state.known = new Set(p.known || []);
    state.again = new Set(p.again || []);
  } catch (e) { }
}
function saveProgress() {
  try {
    localStorage.setItem('flashcard_progress_v2', JSON.stringify({
      known: Array.from(state.known),
      again: Array.from(state.again)
    }));
  } catch (e) { }
}
function exportProgress() {
  var data = {
    known: Array.from(state.known),
    again: Array.from(state.again),
    exportedAt: new Date().toISOString()
  };
  var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '抽认卡学习进度.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
}
function importProgress(file) {
  var reader = new FileReader();
  reader.onload = function (e) {
    try {
      var p = JSON.parse(e.target.result);
      if (!p || !Array.isArray(p.known) || !Array.isArray(p.again)) throw new Error('bad');
      state.known = new Set(p.known.filter(function (x) { return typeof x === 'number'; }));
      state.again = new Set(p.again.filter(function (x) { return typeof x === 'number'; }));
      saveProgress();
      buildQueue();
      render();
      alert('导入成功：已记住 ' + state.known.size + ' 条，待复习 ' + state.again.size + ' 条');
    } catch (err) {
      alert('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
}

var catNames = {};
CARDS.forEach(function (c) { if (!catNames[c.cat]) catNames[c.cat] = c.catName; });
var catKeys = Object.keys(catNames);

function catTotal(key) { return CARDS.filter(function (c) { return c.cat === parseInt(key, 10); }).length; }

function renderChips() {
  var chips = document.getElementById('chips');
  var html = '<button class="chip' + (state.cat === 'all' ? ' active' : '') + '" data-cat="all">全部<span class="n">' + CARDS.length + '</span></button>';
  catKeys.forEach(function (k) {
    var n = catTotal(k);
    html += '<button class="chip' + (state.cat === k ? ' active' : '') + '" data-cat="' + k + '">' + catNames[k] + '<span class="n">' + n + '</span></button>';
  });
  chips.innerHTML = html;
  chips.querySelectorAll('.chip').forEach(function (b) {
    b.addEventListener('click', function () {
      state.cat = b.getAttribute('data-cat');
      state.idx = 0; state.flipped = false;
      renderChips(); buildQueue(); render();
    });
  });
}

function buildQueue() {
  var list = CARDS;
  if (state.cat !== 'all') list = list.filter(function (c) { return c.cat === parseInt(state.cat, 10); });
  if (state.mode === 'review') {
    var againSet = state.again;
    list = list.filter(function (c) { return againSet.has(c.id); });
  }
  if (state.mode === 'unseen') {
    list = list.filter(function (c) { return !state.known.has(c.id) && !state.again.has(c.id); });
  }
  if (state.mode === 'rand') {
    list = list.slice().sort(function () { return Math.random() - 0.5; });
  }
  state.queue = list;
  state.idx = 0;
}

function dirOfCard() {
  return state.dir;
}

function render() {
  var card = document.getElementById('card');
  var catTag = document.getElementById('catTag');
  var dirLabel = document.getElementById('dirLabel');
  var frontText = document.getElementById('frontText');
  var backText = document.getElementById('backText');
  var origText = document.getElementById('origText');
  var hint = document.getElementById('hint');
  var btnAgain = document.getElementById('btnAgain');
  var btnKnown = document.getElementById('btnKnown');
  var progress = document.getElementById('progress');

  if (state.queue.length === 0) {
    var emptyMsg = state.mode === 'review' ? '没记住的卡片已清零，太棒了！' : (state.mode === 'unseen' ? '未复习的卡片已清零，全部过了一遍！' : '当前分类没有卡片');
    card.innerHTML = '<div class="empty">' + emptyMsg + '</div>';
    catTag.textContent = ''; dirLabel.textContent = '';
    hint.classList.add('hidden');
    btnAgain.disabled = true; btnKnown.disabled = true;
    progress.textContent = '';
    updateReviewBar();
    return;
  }

  var c = state.queue[state.idx];
  var catName = catNames[c.cat];
  var dir = dirOfCard(c);
  var zhEmpty = !c.zh || c.zh.length === 0;

  card.classList.remove('flipped', 'again-mark', 'known-mark');
  if (state.again.has(c.id)) card.classList.add('again-mark');
  if (state.known.has(c.id)) card.classList.add('known-mark');
  catTag.textContent = catName;
  dirLabel.textContent = (dir === 'zh2en') ? '中 → 英' : '英 → 中';
  frontText.classList.remove('hidden');
  backText.classList.add('hidden');
  origText.classList.add('hidden');

  if (state.flipped) {
    card.classList.add('flipped');
    frontText.classList.add('hidden');
    if (dir === 'zh2en') {
      backText.textContent = c.en || '';
      origText.textContent = c.zh || '';
    } else {
      backText.textContent = c.zh || '（无释义）';
      origText.textContent = c.en || '';
    }
    backText.classList.remove('hidden');
    origText.classList.remove('hidden');
    hint.textContent = '点击卡片翻回';
  } else {
    if (dir === 'zh2en') {
      frontText.textContent = (zhEmpty ? '(no zh)' : c.zh);
    } else {
      frontText.textContent = c.en || '';
    }
    hint.textContent = '点击卡片翻面';
  }
  btnAgain.disabled = false; btnKnown.disabled = false;
  var knownCount = state.queue.filter(function (x) { return state.known.has(x.id); }).length;
  progress.innerHTML = '第 <b>' + (state.idx + 1) + '</b> / ' + state.queue.length + ' 张 ｜ 已掌握 <b>' + knownCount + '</b> ｜ 待复习 <b>' + state.again.size + '</b>';
  document.getElementById('cardCount').textContent = '共 ' + CARDS.length + ' 条 · ' + catName;
  updateReviewBar();
}

function updateReviewBar() {
  var list = CARDS;
  if (state.cat !== 'all') list = list.filter(function (c) { return c.cat === parseInt(state.cat, 10); });
  var total = list.length;
  var reviewed = 0;
  for (var i = 0; i < list.length; i++) {
    if (state.known.has(list[i].id) || state.again.has(list[i].id)) reviewed++;
  }
  var unseen = total - reviewed;
  var pct = total ? Math.round(reviewed / total * 100) : 0;
  document.getElementById('rpScope').textContent = state.cat === 'all' ? '全部' : catNames[state.cat];
  document.getElementById('rpReviewed').textContent = reviewed;
  document.getElementById('rpTotal').textContent = total;
  document.getElementById('rpUnseen').textContent = unseen;
  document.getElementById('rpPct').textContent = pct + '%';
  document.getElementById('rpFill').style.width = pct + '%';
}

function flip() {
  if (state.queue.length === 0) return;
  state.flipped = !state.flipped;
  render();
}

function next(verdict) {
  if (state.queue.length === 0) return;
  var c = state.queue[state.idx];
  if (verdict === 'known') { state.known.add(c.id); state.again.delete(c.id); }
  else { state.known.delete(c.id); state.again.add(c.id); }
  saveProgress();
  if (state.idx < state.queue.length - 1) {
    state.idx++; state.flipped = false; render();
  } else {
    state.flipped = false; render();
  }
}

document.getElementById('card').addEventListener('click', flip);
document.getElementById('btnAgain').addEventListener('click', function () { next('again'); });
document.getElementById('btnKnown').addEventListener('click', function () { next('known'); });

document.querySelectorAll('.mode-btn[data-mode]').forEach(function (b) {
  b.addEventListener('click', function () {
    state.mode = b.getAttribute('data-mode');
    document.querySelectorAll('.mode-btn[data-mode]').forEach(function (x) { x.classList.remove('active'); });
    b.classList.add('active');
    state.idx = 0; state.flipped = false;
    buildQueue(); render();
  });
});

document.querySelectorAll('.dir-btn').forEach(function (b) {
  b.addEventListener('click', function () {
    state.dir = b.getAttribute('data-dir');
    document.querySelectorAll('.dir-btn').forEach(function (x) { x.classList.remove('active'); });
    b.classList.add('active');
    state.idx = 0; state.flipped = false;
    render();
  });
});

document.getElementById('btnReset').addEventListener('click', function () {
  if (!confirm('确定重置全部学习进度？')) return;
  state.known.clear(); state.again.clear();
  saveProgress(); buildQueue(); render();
});

(function() {
  var modal = document.getElementById('codeModal');
  var area = document.getElementById('codeArea');
  var btnCode = document.getElementById('btnCode');
  var btnCopy = document.getElementById('codeCopy');
  var btnPaste = document.getElementById('codePaste');
  var btnClose = document.getElementById('codeClose');
  var statsBox = document.getElementById('codeStats');

  function calcStats(kSize, aSize) {
    var total = CARDS.length;
    var reviewed = kSize + aSize;
    return { total: total, reviewed: reviewed, unseen: total - reviewed, pct: total ? Math.round(reviewed / total * 100) : 0 };
  }
  function fmtTs(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function showStats(k, a, ts) {
    var s = calcStats(k.size, a.size);
    document.getElementById('csReviewed').textContent = s.reviewed;
    document.getElementById('csTotal').textContent = s.total;
    document.getElementById('csUnseen').textContent = s.unseen;
    document.getElementById('csPct').textContent = s.pct + '%';
    document.getElementById('csFill').style.width = s.pct + '%';
    document.getElementById('csKnown').textContent = k.size;
    document.getElementById('csAgain').textContent = a.size;
    document.getElementById('csTs').textContent = ts ? '保存时间：' + fmtTs(ts) : '';
    statsBox.classList.remove('hidden');
  }
  function encodeProgress() {
    return btoa(JSON.stringify({
      v: 2,
      ts: Date.now(),
      k: Array.from(state.known),
      a: Array.from(state.again)
    }));
  }
  function decodeProgress(str) {
    var p = JSON.parse(atob(str.trim()));
    var k = Array.isArray(p.k) ? p.k : (Array.isArray(p.known) ? p.known : []);
    var a = Array.isArray(p.a) ? p.a : (Array.isArray(p.again) ? p.again : []);
    return { known: k, again: a, ts: p.ts || null };
  }
  function cleanIds(arr) {
    return new Set(arr.map(Number).filter(function (x) { return !isNaN(x) && x >= 0; }));
  }

  btnCode.addEventListener('click', function() {
    area.value = encodeProgress();
    showStats(state.known, state.again, Date.now());
    modal.classList.remove('hidden');
  });
  btnCopy.addEventListener('click', function() {
    area.select();
    navigator.clipboard.writeText(area.value).then(function() { btnCopy.textContent = '已复制'; setTimeout(function() { btnCopy.textContent = '复制'; }, 1500); });
  });
  btnPaste.addEventListener('click', function() {
    var code = area.value.trim();
    if (!code) { alert('请先粘贴进度码'); return; }
    try {
      var p = decodeProgress(code);
      var k = cleanIds(p.known);
      var a = cleanIds(p.again);
      var curS = calcStats(state.known.size, state.again.size);
      var newS = calcStats(k.size, a.size);
      showStats(k, a, p.ts);
      if (!confirm('将恢复为：已复习 ' + newS.reviewed + ' / ' + newS.total + '（' + newS.pct + '%），记住 ' + k.size + '，待复习 ' + a.size + '，未复习 ' + newS.unseen + '。\n当前进度：已复习 ' + curS.reviewed + ' / ' + curS.total + '（' + curS.pct + '%）。\n确定覆盖当前进度吗？')) return;
      state.known = k;
      state.again = a;
      saveProgress(); buildQueue(); render();
      alert('恢复成功：已复习 ' + newS.reviewed + ' 张（' + newS.pct + '%），未复习 ' + newS.unseen + ' 张；记住 ' + k.size + ' 张，待复习 ' + a.size + ' 张');
      modal.classList.add('hidden');
    } catch(e) { alert('进度码格式不正确'); }
  });
  btnClose.addEventListener('click', function() { modal.classList.add('hidden'); });
  modal.addEventListener('click', function(e) { if (e.target === modal) modal.classList.add('hidden'); });
})();

document.addEventListener('keydown', function (e) {
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.code === 'ArrowRight' || e.code === 'KeyK') next('known');
  else if (e.code === 'ArrowLeft' || e.code === 'KeyA') next('again');
});

loadProgress();
renderChips();
document.querySelector('.dir-btn[data-dir="' + state.dir + '"]').classList.add('active');
document.querySelector('.mode-btn[data-mode="' + state.mode + '"]').classList.add('active');
buildQueue();
render();
</script>
</body>
</html>
